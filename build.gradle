plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "baritonestudio-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Синхронизатор сети gametest иногда ложно срабатывает на программном рендере (Xvfb) – отключаем для стабильности.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (it.hasProperty('jvmArgs')) it.jvmArgs('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
    if (project.hasProperty('onlyMovement') && it.hasProperty('jvmArgs')) it.jvmArgs('-Dbs.only.movement=1')
    if (project.hasProperty('onlyHuman') && it.hasProperty('jvmArgs')) it.jvmArgs('-Dbs.only.human=1')
}
